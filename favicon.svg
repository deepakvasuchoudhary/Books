<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Leather Cover Base -->
    <linearGradient id="coverGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Warm Ivory Paper Leaves -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Radiant Gold Star -->
    <linearGradient id="goldStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Contrast against Light Tabs -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Terracotta Outer Trim & Spine Underlay -->
    <path d="M6 48 C15 43 25 43 32 46.5 C39 43 49 43 58 48 L58 20 C49 15.5 39 15.5 32 19 C25 15.5 15 15.5 6 20 Z" fill="url(#coverGrad)"/>

    <!-- Stacked Volumetric Paper Block -->
    <path d="M8 46.2 C16 41.8 25 41.8 32 45.2 C39 41.8 48 41.8 56 46.2 L56 20 C48 16 39 16 32 19.4 C25 16 16 16 8 20 Z" fill="#e7ded0"/>

    <!-- Left Page Wing (Verso) -->
    <path d="M32 43.2 C25 39.8 16 39.8 9 42.4 L9 18.5 C16 15.8 25 15.8 32 19.2 Z" fill="url(#pageGrad)"/>

    <!-- Right Page Wing (Recto) -->
    <path d="M32 43.2 C39 39.8 48 39.8 55 42.4 L55 18.5 C48 15.8 39 15.8 32 19.2 Z" fill="url(#pageGrad)"/>

    <!-- Spine Gutter Shadow Crease -->
    <path d="M31 19.2 L31 43.2 L33 43.2 L33 19.2 Z" fill="#78350f" opacity="0.45"/>

    <!-- Vibrant Crimson Silk Ribbon -->
    <path d="M29.5 41 L32 49 L34.5 41 L34.5 19.2 L29.5 19.2 Z" fill="#e11d48"/>

    <!-- Radiant Nalanda Flame / Star of Wisdom -->
    <path d="M32 2.5 Q32 8 36 9.8 Q32 11.5 32 17 Q32 11.5 28 9.8 Q32 8 32 2.5 Z" fill="url(#goldStar)"/>
    <circle cx="32" cy="9.8" r="1.6" fill="#ffffff"/>
  </g>
</svg>